name: Build MSI Parcel apps

# MSI Parcel v0.6 — Customer app + Driver app + Admin website + backend, packed inside this file.
# Each run: (1) saves the source as real files in the repo (apps/, backend/, ci/),
# (2) builds both Android APKs, (3) publishes them on the Releases page, (4) puts the Admin website online.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-apk.yml' ]

permissions:
  contents: write

