      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: app
        run: |
          set -e
          flutter --version
          flutter create --platforms=android --org com.msibusinesscare --project-name msi_parcel_driver .
          rm -f test/widget_test.dart
          GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n 1)
          sed -i -E 's/minSdk( =|) *flutter\.minSdkVersion/minSdk\1 23/; s/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 23/' "$GRADLE"
          grep -n -i "minsdk\|applicationId" "$GRADLE" || true
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="MSI Parcel Driver"/' "$MANIFEST"
          if ! grep -q ACCESS_FINE_LOCATION "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$MANIFEST"
          fi
          for d in ci/icons/mipmap-*; do cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"; done
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze (report only)
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: |
          if grep -q "Firebase is not configured" lib/firebase_options.dart; then
            echo "Firebase not configured: building DEMO mode"
            flutter build apk --release
          else
            flutter build apk --release --dart-define=USE_FIREBASE=true
          fi
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/MSI-Parcel-Driver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MSI-Parcel-Driver-APK
          path: out/MSI-Parcel-Driver.apk
          if-no-files-found: error
