name: Build MSI Parcel apps

# MSI Parcel v0.5 — Customer app + Driver app + backend, packed inside this file.
# Each run: (1) saves the source as real files in the repo (apps/, backend/, ci/),
# (2) builds both Android APKs, (3) publishes them on the Releases page.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-apk.yml' ]

permissions:
  contents: write

