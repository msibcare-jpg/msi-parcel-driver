        run: |
          set -e
          rm -rf apps backend ci
          cp -a src/apps src/backend src/ci .
          cp src/README.md README.md
          git config user.name "msi-parcel-bot"
          git config user.email "msi-parcel-bot@users.noreply.github.com"
          git add apps backend ci README.md
          if git diff --cached --quiet; then echo "No source changes"; else git commit -m "Update app source [skip ci]" && git push; fi

  android:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: driver
            pkg: msi_parcel_driver
            label: MSI Parcel Driver
            apk: MSI-Parcel-Driver.apk
          - app: customer
            pkg: msi_parcel_customer
            label: MSI Parcel
            apk: MSI-Parcel-Customer.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src
      - name: Prepare ${{ matrix.app }}
        run: |
          set -e
          mkdir -p app
          cp -a src/apps/${{ matrix.app }}/. app/
          mkdir -p app/assets/images
          if [ -f msi_parcel_logo.png ]; then
            cp msi_parcel_logo.png app/assets/images/msi_parcel_logo.png
          else
            Z=$(ls MSI-Parcel-Driver-*-source.zip 2>/dev/null | head -n 1)
            unzip -j -o "$Z" 'assets/images/msi_parcel_logo.png' -d app/assets/images/
          fi
          ls -la app/lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: app
        run: |
          set -e
          flutter --version
          flutter create --platforms=android --org com.msibusinesscare --project-name ${{ matrix.pkg }} .
          rm -f test/widget_test.dart
          GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n 1)
          sed -i -E 's/minSdk( =|) *flutter\.minSdkVersion/minSdk\1 23/; s/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 23/' "$GRADLE"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="${{ matrix.label }}"/' "$MANIFEST"
          if [ "${{ matrix.app }}" = "driver" ]; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$MANIFEST"
          else
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          for d in ../src/ci/icons/mipmap-*; do cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"; done
          mkdir -p ~/.android && cp ../src/ci/debug.keystore ~/.android/debug.keystore
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Analyze (report only)
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Unit tests
        working-directory: app
        run: flutter test
      - name: Build APK
        working-directory: app
        run: |
          set -e
          if grep -q "Firebase is not configured" lib/firebase_options.dart; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --release --split-per-abi --dart-define=USE_FIREBASE=true
          fi
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/${{ matrix.apk }}
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: out/${{ matrix.apk }}
          if-no-files-found: error

  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MSI-Parcel-*.apk
          merge-multiple: true
          path: apks
      - name: Publish on Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la apks
          TAG="v0.5.${{ github.run_number }}"
          gh release create "$TAG" apks/*.apk --repo "${{ github.repository }}" \
            --title "MSI Parcel apps — build ${{ github.run_number }}" \
            --notes "Install on Android: open this page on your phone and tap an APK. Customer app: MSI-Parcel-Customer.apk. Driver app: MSI-Parcel-Driver.apk. Demo SMS code: 123456." \
            --latest
